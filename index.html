<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El derecho al daño autoinfligido</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
/* ===========================================
   VIEWPORT FITTING: MANDATORY BASE STYLES
   (viewport-base.css, incluido completo)
   =========================================== */
html, body { height: 100%; overflow-x: hidden; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
.slide { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; scroll-snap-align: start; display: flex; flex-direction: column; position: relative; }
.slide-content { flex: 1; display: flex; flex-direction: column; justify-content: center; max-height: 100%; overflow: hidden; padding: var(--slide-padding); }
:root {
  --title-size: clamp(1.5rem, 5vw, 4rem); --h2-size: clamp(1.25rem, 3.5vw, 2.5rem); --h3-size: clamp(1rem, 2.5vw, 1.75rem);
  --body-size: clamp(0.75rem, 1.5vw, 1.125rem); --small-size: clamp(0.65rem, 1vw, 0.875rem);
  --slide-padding: clamp(1rem, 4vw, 4rem); --content-gap: clamp(0.5rem, 2vw, 2rem); --element-gap: clamp(0.25rem, 1vw, 1rem);
}
.card, .container, .content-box { max-width: min(90vw, 1000px); max-height: min(80vh, 700px); }
.feature-list, .bullet-list { gap: clamp(0.4rem, 1vh, 1rem); }
.feature-list li, .bullet-list li { font-size: var(--body-size); line-height: 1.4; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: clamp(0.5rem, 1.5vw, 1rem); }
img, .image-container { max-width: 100%; max-height: min(50vh, 400px); object-fit: contain; }
@media (max-height: 700px) { :root { --slide-padding: clamp(0.75rem, 3vw, 2rem); --content-gap: clamp(0.4rem, 1.5vw, 1rem); --title-size: clamp(1.25rem, 4.5vw, 2.5rem); --h2-size: clamp(1rem, 3vw, 1.75rem); } }
@media (max-height: 600px) { :root { --slide-padding: clamp(0.5rem, 2.5vw, 1.5rem); --content-gap: clamp(0.3rem, 1vw, 0.75rem); --title-size: clamp(1.1rem, 4vw, 2rem); --body-size: clamp(0.7rem, 1.2vw, 0.95rem); } .nav-dots, .keyboard-hint, .decorative { display: none; } }
@media (max-height: 500px) { :root { --slide-padding: clamp(0.4rem, 2vw, 1rem); --title-size: clamp(1rem, 3.5vw, 1.5rem); --h2-size: clamp(0.9rem, 2.5vw, 1.25rem); --body-size: clamp(0.65rem, 1vw, 0.85rem); } }
@media (max-width: 600px) { :root { --title-size: clamp(1.25rem, 7vw, 2.5rem); } .grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; } html { scroll-behavior: auto; } }

/* ===========================================
   TEMA: CONSOLA PORTÁTIL DE CUATRO TONOS
   Cambia estos colores para cambiar todo el look.
   Los sprites usan los mismos tonos (ver COL en el script).
   =========================================== */
:root { --g0:#0f380f; --g1:#306230; --g2:#8bac0f; --g3:#9bbc0f; --grid:rgba(15,56,15,.05); }

/* ===========================================
   PANTALLA VIRTUAL DE 480 x 270
   0.1rem equivale a un pixel virtual. La pantalla se escala
   entera a la ventana, así que nada se desborda nunca.
   =========================================== */
html { font-size: calc(min(100vw, 177.78vh) / 48); }
* { box-sizing: border-box; margin: 0; padding: 0; font-variant-ligatures: none; }
body { height: 100vh; overflow: hidden; background: var(--g0); color: var(--g0); display: grid; place-items: center; cursor: pointer; user-select: none; }
#stage { position: relative; width: 48rem; height: 27rem; overflow: hidden; background: var(--g3);
  background-image: linear-gradient(var(--grid) .1rem, transparent .1rem), linear-gradient(90deg, var(--grid) .1rem, transparent .1rem); background-size: .4rem .4rem; }

/* === TIPOGRAFÍA ===
   Silkscreen: etiquetas en mayúsculas. VT323: texto de lectura. */
.p2 { font: 1rem/1.4 'Silkscreen', monospace; }
.p2.sm { font-size: .8rem; }
.t { font: 1.1rem/1.2 'VT323', monospace; }
.t.lg { font-size: 1.45rem; }
.t.sm { font-size: 1rem; }
h1 { font-weight: 400; }

/* === BARRA SUPERIOR (capítulo y progreso) === */
#hud { position: absolute; inset: 0 0 auto 0; height: 1.4rem; background: var(--g0); color: var(--g3); font: .8rem 'Silkscreen', monospace; display: flex; align-items: center; justify-content: space-between; padding: 0 .6rem; z-index: 20; }
#bar { position: absolute; left: 0; bottom: 0; height: .2rem; background: var(--g2); transition: width .3s steps(4); }
.full #hud, .full #dlg { display: none; }

/* === ÁREA DE ESCENA === */
#view { position: absolute; top: 1.4rem; left: 0; right: 0; height: 18rem; }
.full #view { top: 0; height: 27rem; }

/* === CAJA DE TEXTO (efecto de máquina de escribir) === */
#dlg { position: absolute; left: .4rem; right: .4rem; bottom: .4rem; height: 6.8rem; border: .2rem solid var(--g0); background: var(--g3); box-shadow: inset 0 0 0 .2rem var(--g3), inset 0 0 0 .4rem var(--g1); padding: .7rem 1.3rem; font: 1.35rem/1.25 'VT323', monospace; z-index: 10; }
#dlg.done::after { content: ''; position: absolute; right: 1rem; bottom: .8rem; border: .4rem solid transparent; border-top-color: var(--g0); border-bottom: 0; animation: blink .8s steps(1) infinite; }

/* === PIEZAS COMUNES === */
.box { border: .2rem solid var(--g0); background: var(--g3); padding: .6rem .8rem; }
.tag { display: inline-block; border: .1rem solid var(--g0); font: .8rem/1 'Silkscreen', monospace; padding: .3rem .4rem; font-weight: 400; white-space: nowrap; }
.tag.neg { background: var(--g0); color: var(--g3); }
.spr { image-rendering: pixelated; display: block; flex: none; }
.flag { outline: .2rem solid var(--g0); }
.pad { position: absolute; inset: .8rem 1rem; display: flex; flex-direction: column; gap: .6rem; }
.hdr { display: flex; align-items: center; gap: .8rem; flex: none; }
.hd { font: 700 1.05rem/1 'Silkscreen', monospace; background: var(--g0); color: var(--g3); padding: .4rem .6rem; align-self: flex-start; }
.cols { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); gap: .8rem; flex: 1; min-height: 0; }
.ctr { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem; }
.stack { display: flex; flex-direction: column; gap: .6rem; justify-content: center; }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.crd { display: flex; flex-direction: column; align-items: center; gap: .5rem; text-align: center; padding: .7rem .6rem; }
.crd .t { font-size: 1.1rem; }
.crd .ex { font-size: 1rem; border-top: .1rem dashed var(--g1); padding-top: .4rem; width: 100%; }
.fl { display: flex; flex-direction: column; align-items: center; gap: .5rem; }
.list { padding: .3rem .8rem; }
.row { display: flex; align-items: center; gap: .8rem; padding: .2rem 0; border-bottom: .1rem dashed var(--g1); }
.row:last-child { border-bottom: 0; }
.row .tag { margin-left: auto; }
.li::before { content: ''; display: inline-block; width: .5rem; height: .5rem; background: var(--g0); margin-right: .6rem; vertical-align: .15rem; }
.hp { height: .8rem; border: .2rem solid var(--g0); background: var(--g3); margin-top: .3rem; }
.hp i { display: block; height: 100%; background: var(--g1); transition: width .8s steps(8); }
.hi { box-shadow: 0 0 0 .3rem var(--g3), 0 0 0 .5rem var(--g0); }
.def { display: flex; gap: .8rem; align-items: center; }

/* === REVELADO POR PASOS: .h está oculto hasta recibir .on === */
.h { visibility: hidden; }
.h.on { visibility: visible; animation: pop .3s steps(3) both; }
@keyframes pop { from { opacity: 0; transform: translateY(.8rem); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes bob { 50% { transform: translateY(-.2rem); } }
@keyframes drop { from { transform: translateY(-14rem); } }
.bob { animation: bob 1s steps(2) infinite; }
.blink { animation: blink 1s steps(1) infinite; }

/* === CORTINA ENTRE ESCENAS === */
#wipe { position: absolute; inset: 0; background: var(--g0); z-index: 40; transform: translateX(-100%); pointer-events: none; }
#wipe.go { animation: wipe .54s steps(6) both; }
@keyframes wipe { 0% { transform: translateX(-100%); } 45%, 55% { transform: none; } 100% { transform: translateX(100%); } }

/* === MENÚ DE ESCENAS (tecla M) === */
#menu { position: absolute; inset: 1rem; z-index: 50; display: none; grid-template-columns: 1fr 1fr; grid-auto-flow: column; grid-template-rows: auto repeat(21, auto); gap: 0 1rem; padding: .8rem 1rem; box-shadow: .6rem .6rem 0 var(--g1); }
#menu.open { display: grid; }
#menu h2 { grid-column: 1 / -1; font: 1rem 'Silkscreen', monospace; font-weight: 400; padding-bottom: .4rem; }
#menu a { font: .95rem/1.05 'VT323', monospace; padding: 0 .4rem; white-space: nowrap; overflow: hidden; }
#menu a.sel { background: var(--g0); color: var(--g3); }

/* === ESCENA: TÍTULO Y CRÉDITOS === */
.ttl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; }
.ttl h1 { font: 700 2.4rem/1.3 'Silkscreen', monospace; text-shadow: .2rem .2rem 0 var(--g2); animation: drop .8s steps(8) both; }
.ttl .t { font-size: 1.5rem; }
.icons { display: flex; align-items: flex-end; gap: 1.6rem; }

/* === ESCENA: MAPA === */
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map h2 { position: absolute; bottom: .6rem; left: 0; right: 0; text-align: center; font-weight: 400; }
.node { position: absolute; width: 3rem; height: 3rem; border: .2rem solid var(--g0); background: var(--g3); display: grid; place-items: center; animation: pop .3s steps(3) both; }
.node.done { background: var(--g2); }
.node.cur { animation: pop .3s steps(3) both, ring .6s steps(1) .5s infinite; }
@keyframes ring { 50% { box-shadow: 0 0 0 .3rem var(--g3), 0 0 0 .5rem var(--g0); } }
.nl { position: absolute; width: 7.6rem; text-align: center; }
#mh { position: absolute; transition: left 1.2s steps(12), top 1.2s steps(12); }

/* === ESCENAS SUELTAS === */
.ask { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 32rem; text-align: center; padding: 1rem; box-shadow: 0 0 0 .2rem var(--g3), .7rem .7rem 0 var(--g1); z-index: 5; }
.slow { animation: bob 1.8s steps(2) infinite; }
.fast { animation: bob .25s steps(2) infinite; }
.wob { animation: wob 1.2s steps(4) infinite; }
@keyframes wob { 25% { transform: skewX(18deg) scale(1.1); } 75% { transform: skewX(-18deg) scale(.9); } }
.grp { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: center; align-content: flex-end; }
.scale { display: grid; grid-template-columns: repeat(4, 1fr); height: 1.2rem; border: .2rem solid var(--g0); flex: none; }
.scale i:nth-child(2) { background: var(--g2); } .scale i:nth-child(3) { background: var(--g1); } .scale i:nth-child(4) { background: var(--g0); }
.ends { display: flex; justify-content: space-between; align-items: center; }
.mach { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.4rem; flex: 1; align-items: center; }
.dials { display: flex; flex-direction: column; gap: .4rem; }
.dial { display: grid; grid-template-columns: 10rem 1fr; align-items: center; gap: .6rem; }
.dial .hp { margin: 0; }
.hp.big { height: 2rem; }
.tl { position: relative; flex: 1; display: flex; flex-direction: column; gap: .4rem; }
.trk { position: relative; height: 3.2rem; flex: none; }
#th { position: absolute; bottom: 0; left: 8.33%; translate: -50% 0; transition: left .8s steps(8); }
.ln { height: .4rem; background: var(--g0); flex: none; }
.tc { display: flex; flex-direction: column; align-items: center; gap: .35rem; text-align: center; }
.door { width: 3rem; height: 4rem; border: .2rem solid var(--g0); position: relative; flex: none; }
.door::after { content: ''; position: absolute; right: .3rem; top: 1.8rem; width: .4rem; height: .4rem; background: var(--g2); }
.d1 { background: var(--g0); } .d2 { background: linear-gradient(90deg, var(--g0) 50%, var(--g3) 50%); } .d3 { background: var(--g3); }
.awn { height: 1.2rem; width: 100%; background: repeating-linear-gradient(90deg, var(--g0) 0 1rem, var(--g3) 1rem 2rem); border: .2rem solid var(--g0); flex: none; }
.case { display: flex; flex-direction: column; gap: .2rem; padding: .4rem .8rem; }
.thesis { font-size: 1.45rem; }
.fc { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem; text-align: center; }
.ico { width: 2.6rem; display: flex; justify-content: center; flex: none; }
.ir { display: flex; align-items: center; gap: .7rem; padding: .15rem 0; }
/* Animaciones extra: filas que entran desde la izquierda, tarjetas escalonadas,
   banderas ondeando, burbujas y vapor, barras que crecen */
.row.h.on { animation: slideL .35s steps(4) both; }
@keyframes slideL { from { opacity: 0; transform: translateX(-2rem); } }
.row.h.on:nth-child(2), .crd.h.on:nth-child(2), .fc.h.on:nth-child(2) { animation-delay: .1s; }
.row.h.on:nth-child(3), .crd.h.on:nth-child(3), .fc.h.on:nth-child(3) { animation-delay: .2s; }
.row.h.on:nth-child(4), .crd.h.on:nth-child(4), .fc.h.on:nth-child(4) { animation-delay: .3s; }
.row.h.on:nth-child(5), .fc.h.on:nth-child(5) { animation-delay: .4s; }
.row.h.on:nth-child(6), .fc.h.on:nth-child(6) { animation-delay: .5s; }
.row.h.on:nth-child(7), .fc.h.on:nth-child(7) { animation-delay: .6s; }
.flag.wave { animation: wave 1.6s steps(2) infinite; }
@keyframes wave { 50% { transform: skewY(-4deg); } }
.lab { position: relative; display: inline-block; }
.bubs i { position: absolute; left: 45%; bottom: 75%; width: .5rem; height: .5rem; background: var(--g1); opacity: 0; animation: rise 1.8s steps(6) infinite; }
.bubs i:nth-child(2) { left: 25%; animation-delay: .6s; }
.bubs i:nth-child(3) { left: 62%; animation-delay: 1.2s; }
@keyframes rise { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-3rem); } }
.bars { display: flex; flex-direction: column; justify-content: center; gap: .25rem; flex: 1; }
.br { display: grid; grid-template-columns: 12rem 1fr 2.4rem; align-items: center; gap: .6rem; }
.br .t { line-height: 1; }
.trk2 { height: .9rem; }
.trk2 i { display: block; height: 100%; background: var(--g1); transition: width 1.2s steps(12); }
.br.hl .trk2 i { background: var(--g0); }
.br.hl .p2 { font-weight: 700; }
.sev { height: 1.2rem; border: .2rem solid var(--g0); flex: none; position: relative; overflow: hidden; }
.sev i { position: absolute; inset: 0; background: linear-gradient(90deg, var(--g3), var(--g2) 35%, var(--g1) 70%, var(--g0)); transform-origin: left; }
.sev.on i { animation: grow 1.2s steps(12) both; }
@keyframes grow { from { transform: scaleX(0); } }
</style>
</head>
<body>
<main id="stage" aria-live="polite">
  <div id="hud"><span id="hl"></span><span id="hr"></span><i id="bar"></i></div>
  <div id="view"></div>
  <div id="dlg"><p id="txt"></p></div>
  <nav id="menu" class="box" aria-label="Escenas"></nav>
  <div id="wipe"></div>
</main>

<script>
/* ===========================================
   SPRITES
   Cada sprite es una lista de filas. Los dígitos 0 a 3 son los
   cuatro tonos de la pantalla (0 el más oscuro), las letras son
   colores de bandera y el punto es transparente.
   =========================================== */
const COL = { '0': '#0f380f', '1': '#306230', '2': '#8bac0f', '3': '#9bbc0f',
  r: '#c8343a', g: '#2f8a4c', w: '#ffffff', b: '#2b4a9b', c: '#5b9bd5', y: '#f2c230', n: '#7a4b25', k: '#111111' };
const SPR = {
  hero: ["..0000..",".000000.",".022222.",".202202.",".222222.","..1111..",".111111.","21111112",".111111.",".000000.",".00..00.",".00..00."],
  mill: ["..3333..",".133331.",".122221.",".102201.",".122221.","..1221..",".000000.","20033002",".000000.",".000000.",".00..00.",".00..00."],
  crown: ["0...0...0","00.000.00","000000000","022222220","023222320","022222220","000000000"],
  mountain: ["...00...","..0330..","..0330..",".011110.",".011110.","01111110","01111110","00000000"],
  cigarette: ["......2.",".....2..","......2.","........","00000000","03333110","00000000","........"],
  bottle: ["...00...","...00...","..0330..",".033330.",".011110.",".011110.",".011110.",".000000."],
  burger: ["........",".000000.","03232320","00000000","01111110","00000000","03333330",".000000."],
  helmet: ["........","..0000..",".022220.","02222220","02222220","00000000","01111110","........"],
  pill: ["........","........",".000000.","03330110","03330110",".000000.","........","........"],
  coffee: ["..2..2..","...2..2.","........","000000..","01111000","011110.0","01111000",".0000..."],
  book: ["........",".000000.","01111110","01333310","01111110","01111110","03333330",".000000."],
  flask: ["..0000..","...00...","...00...","..0330..","..0330..",".011110.","01111110","00000000"],
  heart: ["........",".00..00.","01100110","01111110","01111110",".011110.","..0110..","...00..."],
  car: ["...000000...","..03303330..","011111111110","011111111112","000000000000",".0330..0330.","..00....00.."],
  gavel: [".0000...",".0110...",".0000...","...00...","....00..",".....00.","0000000.","0111110."],
  globe: ["..0000..",".022110.","02221110","01222110","01112210","01112220",".011220.","..0000.."],
  bulb: ["..0000..",".033330.","03333330","03333330",".033330.","..0110..","..0000..","..0110.."],
  chem: ["..0000..",".000000.",".022222.",".030030.",".222222.","..3113..",".331133.","23311332",".333333.",".000000.",".00..00.",".00..00."],
  shield: ["00000000","01111110","01133110","01333310","01133110",".011110.","..0110..","...00..."],
  skull: [".000000.","03333330","03033030","03333330",".033330.",".030030.",".000000.","........"],
  dice: ["00000000","03333330","03033330","03300330","03300330","03333030","03333330","00000000"],
  leaf: ["...00...","..0110..",".011110.",".011110.",".011110.","..0110..","...00...","...00..."],
  scales: ["....0....","000000000","0...0...0","0...0...0","000.0.000","....0....","..00000.."],
  /* Banderas de 15 x 9 */
  mx: Array(3).fill('gggggwwwwwrrrrr').concat(['gggggwwnwwrrrrr', 'gggggwnnnwrrrrr', 'gggggwwgwwrrrrr'], Array(3).fill('gggggwwwwwrrrrr')),
  pt: ['ggggggrrrrrrrrr', 'ggggggrrrrrrrrr', 'ggggyyyyrrrrrrr', 'ggggywwyrrrrrrr', 'ggggywwyrrrrrrr', 'ggggyyyyrrrrrrr', 'ggggggrrrrrrrrr', 'ggggggrrrrrrrrr', 'ggggggrrrrrrrrr'],
  uy: ['wwwwwwwwwwwwwww', 'wwywwbbbbbbbbbb', 'wyyywwwwwwwwwww', 'wwywwbbbbbbbbbb', 'wwwwwwwwwwwwwww', 'bbbbbbbbbbbbbbb', 'wwwwwwwwwwwwwww', 'bbbbbbbbbbbbbbb', 'wwwwwwwwwwwwwww'],
  ca: ['wwwwwww', 'wwwrwww', 'rwrrrwr', 'wrrrrrw', 'wwrrrww', 'wwwrwww', 'wwwrwww', 'wwwwwww', 'wwwwwww'].map(m => 'rrrr' + m + 'rrrr'),
  us: ['bwbwbwbrrrrrrrr', 'bbbbbbbwwwwwwww', 'bwbwbwbrrrrrrrr', 'bbbbbbbwwwwwwww', 'bwbwbwbrrrrrrrr', 'wwwwwwwwwwwwwww', 'rrrrrrrrrrrrrrr', 'wwwwwwwwwwwwwww', 'rrrrrrrrrrrrrrr'],
  uk: ['wbbbbbwrwbbbbbw', 'bwbbbbwrwbbbbwb', 'bbwbbbwrwbbbwbb', 'wwwwwwwrwwwwwww', 'rrrrrrrrrrrrrrr', 'wwwwwwwrwwwwwww', 'bbwbbbwrwbbbwbb', 'bwbbbbwrwbbbbwb', 'wbbbbbwrwbbbbbw'],
  nl: Array(3).fill('rrrrrrrrrrrrrrr').concat(Array(3).fill('wwwwwwwwwwwwwww'), Array(3).fill('bbbbbbbbbbbbbbb')),
  be: Array(9).fill('kkkkkyyyyyrrrrr'),
  co: Array(5).fill('yyyyyyyyyyyyyyy').concat(Array(2).fill('bbbbbbbbbbbbbbb'), Array(2).fill('rrrrrrrrrrrrrrr')),
  ec: ['yyyyyyyyyyyyyyy', 'yyyyyyyyyyyyyyy', 'yyyyyyyyyyyyyyy', 'yyyyyyynyyyyyyy', 'yyyyyynwnyyyyyy', 'bbbbbbnwnbbbbbb', 'bbbbbbbnbbbbbbb', 'rrrrrrrrrrrrrrr', 'rrrrrrrrrrrrrrr'],
  es: ['rrrrrrrrrrrrrrr', 'rrrrrrrrrrrrrrr', 'yyyyyyyyyyyyyyy', 'yyyyyyyyyyyyyyy', 'yyyrryyyyyyyyyy', 'yyyyyyyyyyyyyyy', 'yyyyyyyyyyyyyyy', 'rrrrrrrrrrrrrrr', 'rrrrrrrrrrrrrrr'],
  ch: ['rrrrrrrrrrrrrrr', 'rrrrrrwwwrrrrrr', 'rrrrrrwwwrrrrrr', 'rrrwwwwwwwwwrrr', 'rrrwwwwwwwwwrrr', 'rrrwwwwwwwwwrrr', 'rrrrrrwwwrrrrrr', 'rrrrrrwwwrrrrrr', 'rrrrrrrrrrrrrrr'],
  un: ['ccccccccccccccc', 'ccccccccccccccc', 'ccccccwwwcccccc', 'cccccwcccwccccc', 'cccccwcwcwccccc', 'cccccwcccwccccc', 'ccccccwwwcccccc', 'ccccccccccccccc', 'ccccccccccccccc']
};
/* ic(nombre, escala, clase) devuelve el canvas de un sprite */
const ic = (s, k = 2, c = '') => `<canvas class="spr ${c}" data-s="${s}" data-k="${k}"></canvas>`;
function drawSprites(root) {
  root.querySelectorAll('canvas[data-s]').forEach(c => {
    const rows = SPR[c.dataset.s]; c.width = rows[0].length; c.height = rows.length;
    c.style.width = (rows[0].length * c.dataset.k / 10) + 'rem';
    const x = c.getContext('2d');
    rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch !== '.') { x.fillStyle = COL[ch]; x.fillRect(i, j, 1, 1); } }));

}

/* Mapa: el personaje camina del capítulo anterior al capítulo n */
const PLACES = ['EL DILEMA', 'RIESGO Y PELIGRO', 'HISTORIA', 'MARCO LEGAL', 'POSTURA ÉTICA', 'MÁS ALLÁ DE LAS DROGAS'];
const PICON = ['scales', 'flask', 'book', 'gavel', 'bulb', 'globe'];
const NX = i => 4.4 + i * 7.84, NY = i => (i % 2 ? 11.2 : 6.6);
function map(n, say) {
  const from = Math.max(0, n - 1);
  const nodes = PLACES.map((p, i) => `<div class="node ${i < n ? 'done' : i === n ? 'cur' : ''}" style="left:${NX(i) - 1.5}rem;top:${NY(i) - 1.5}rem;animation-delay:${i * .1}s">${ic(PICON[i], 2.5)}</div><p class="nl p2 sm" style="left:${NX(i) - 3.8}rem;top:${NY(i) + 1.9}rem">${p}</p>`).join('');

  const hx = i => (NX(i) - 1.2) + 'rem', hy = i => (NY(i) - 5.4) + 'rem';

/* ===========================================
   MOTOR
   Flecha derecha, espacio o clic: siguiente paso.
   Flecha izquierda: paso anterior. Arriba y abajo: saltar de escena.
   M: menú de escenas. F: pantalla completa.
   =========================================== */
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const stage = $('#stage'), view = $('#view'), dlg = $('#dlg'), txt = $('#txt'), menu = $('#menu'), wipe = $('#wipe');
const TOTAL = SC.reduce((n, s) => n + s.beats.length, 0);
let S = 0, B = 0, lock = false, typing = false, timer = null, fullText = '', msel = 0;

/* Texto de la caja inferior, letra por letra */
function endType() { clearInterval(timer); typing = false; txt.textContent = fullText; dlg.classList.add('done'); }
function say(t, anim) {
  clearInterval(timer); fullText = t; dlg.classList.remove('done');
  if (!anim || SC[S].full) return endType();
  let i = 0; typing = true; txt.textContent = '';
  timer = setInterval(() => { i += 2; txt.textContent = t.slice(0, i); if (i >= t.length) endType(); }, 18);
}
/* Aplica un paso a la escena actual */
function apply(b, anim) {
  if (b.off) $$(b.off).forEach(e => e.classList.remove('on'));
  if (b.on) $$(b.on).forEach(e => e.classList.add('on'));
  for (const [s, c] of Object.entries(b.add || {})) $$(s).forEach(e => e.classList.add(c));
  for (const [s, t] of Object.entries(b.set || {})) $$(s).forEach(e => e.textContent = t);
  for (const [s, o] of Object.entries(b.css || {})) $$(s).forEach(e => Object.assign(e.style, o));
  if (b.say !== undefined) say(b.say, anim);
}
/* Dibuja la escena s y reproduce sus pasos hasta b */
function goto(s, b, anim) {
  S = s; B = b; const sc = SC[s];
  clearInterval(timer); typing = false; txt.textContent = ''; fullText = '';
  stage.classList.toggle('full', !!sc.full);
  view.innerHTML = sc.html; drawSprites(view); void view.offsetWidth;
  for (let i = 0; i <= b; i++) apply(sc.beats[i], anim && i === b);
  hud();
}
function hud() {
  $('#hl').textContent = SC[S].ch; $('#hr').textContent = (S + 1) + '/' + SC.length + ' · M MENÚ';
  let done = B + 1; for (let i = 0; i < S; i++) done += SC[i].beats.length;
  $('#bar').style.width = (100 * done / TOTAL) + '%';
  history.replaceState(null, '', '#' + S + '.' + B);
}
/* Cambio de escena con cortina */
function change(s, b, anim) {
  lock = true; wipe.classList.add('go');
  setTimeout(() => goto(s, b, anim), 260);
  setTimeout(() => { wipe.classList.remove('go'); lock = false; }, 560);
}
function next() {
  if (lock) return;
  if (typing) return endType();
  if (B < SC[S].beats.length - 1) { B++; apply(SC[S].beats[B], true); hud(); }
  else if (S < SC.length - 1) change(S + 1, 0, true);
}
function prev() {
  if (lock) return;
  if (B > 0) goto(S, B - 1, false);
  else if (S > 0) change(S - 1, SC[S - 1].beats.length - 1, false);
}
function jump(s) { if (!lock && s >= 0 && s < SC.length) change(s, 0, true); }

/* Menú de escenas */
function buildMenu() {
  menu.innerHTML = '<h2>ESCENAS</h2>' + SC.map((s, i) => `<a data-i="${i}">${String(i + 1).padStart(2, '0')} ${s.name}</a>`).join('');
}
function toggleMenu(open) {
  menu.classList.toggle('open', open);
  if (menu.classList.contains('open')) { msel = S; markMenu(); }
}
function markMenu() { menu.querySelectorAll('a').forEach((a, i) => a.classList.toggle('sel', i === msel)); }

document.addEventListener('keydown', e => {
  const k = e.key;
  if (menu.classList.contains('open')) {
    if (k === 'ArrowDown') msel = Math.min(SC.length - 1, msel + 1);
    else if (k === 'ArrowUp') msel = Math.max(0, msel - 1);
    else if (k === 'ArrowRight') msel = Math.min(SC.length - 1, msel + 21);
    else if (k === 'ArrowLeft') msel = Math.max(0, msel - 21);
    else if (k === 'Enter') { toggleMenu(false); jump(msel); }
    else if (k === 'Escape' || k === 'm' || k === 'M') toggleMenu(false);
    markMenu(); e.preventDefault(); return;
  }
  if (k === 'ArrowRight' || k === ' ' || k === 'Enter' || k === 'PageDown') { next(); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { prev(); e.preventDefault(); }
  else if (k === 'ArrowDown') { jump(S + 1); e.preventDefault(); }
  else if (k === 'ArrowUp') { jump(S - 1); e.preventDefault(); }
  else if (k === 'm' || k === 'M' || k === 'Escape') toggleMenu();
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
document.addEventListener('click', e => {
  const a = e.target.closest('#menu a');
  if (a) { toggleMenu(false); jump(+a.dataset.i); return; }
  if (menu.classList.contains('open')) return toggleMenu(false);
  next();
});

/* Arranque: retoma la escena guardada en la URL si existe */
buildMenu();
const m = location.hash.match(/^#(\d+)\.(\d+)$/);
const s0 = m ? Math.min(+m[1], SC.length - 1) : 0;
goto(s0, m ? Math.min(+m[2], SC[s0].beats.length - 1) : 0, false);
</script>
